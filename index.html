<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hypertrophy 2.3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 880px tracking column. Sticky bar (brand · view switch · sync). Log is the home view; Progress and Program are one tap away. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5; --surface-3:#e6e6eb;
  --line:rgba(29,29,31,.09); --line-2:rgba(29,29,31,.18);
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#8e8e93;
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.10); --on-accent:#ffffff;
  --up:#1f8a3b; --up-soft:rgba(52,199,89,.15);
  --down:#d70015; --down-soft:rgba(255,59,48,.12);
  --warn:#b25000; --warn-soft:rgba(255,159,10,.16);
  --bar:#c7c7cc; --bar-on:#0071e3;
  --nav-bg:rgba(245,245,247,.82);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.05);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.2);
    --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#7c7c80;
    --accent:#2997ff; --accent-soft:rgba(41,151,255,.18); --on-accent:#ffffff;
    --up:#30d158; --up-soft:rgba(48,209,88,.16);
    --down:#ff6961; --down-soft:rgba(255,69,58,.18);
    --warn:#ffb340; --warn-soft:rgba(255,159,10,.18);
    --bar:#48484a; --bar-on:#2997ff;
    --nav-bg:rgba(18,18,20,.78);
    --shadow:0 0 0 1px rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.2);
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#7c7c80;
  --accent:#2997ff; --accent-soft:rgba(41,151,255,.18); --on-accent:#ffffff;
  --up:#30d158; --up-soft:rgba(48,209,88,.16);
  --down:#ff6961; --down-soft:rgba(255,69,58,.18);
  --warn:#ffb340; --warn-soft:rgba(255,159,10,.18);
  --bar:#48484a; --bar-on:#2997ff;
  --nav-bg:rgba(18,18,20,.78);
  --shadow:0 0 0 1px rgba(255,255,255,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--fg); font:15px/1.45 var(--font); -webkit-font-smoothing:antialiased; margin:0}
button, input, select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:880px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

/* Top bar */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; background:var(--nav-bg); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:12px; height:54px}
.brand{font:700 17px/1 var(--display); letter-spacing:-.01em; white-space:nowrap; display:flex; align-items:center; gap:8px}
.brand i{width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block}
.brand small{font:600 12px/1 var(--font); color:var(--fg-2); letter-spacing:0}
.spacer{flex:1}
.seg{display:inline-flex; background:var(--surface-3); border-radius:10px; padding:2px; gap:2px}
.seg button{appearance:none; border:0; background:transparent; font-weight:600; font-size:13px; padding:7px 13px; border-radius:8px; cursor:pointer; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--fg-2); white-space:nowrap}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--fg-3)}
.sync.ok i{background:var(--up)} .sync.busy i{background:var(--accent)} .sync.warn i{background:var(--warn)}
.icon-btn{appearance:none; border:0; background:var(--surface-2); width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer; flex:none}
.icon-btn svg{width:17px; height:17px}
@media (max-width:620px){
  .top .wrap{height:auto; flex-wrap:wrap; padding-block:8px; row-gap:8px}
  .top .seg{order:3; width:100%; display:grid; grid-template-columns:repeat(3,1fr)}
  .sync span{display:none}
}

main{padding-block:18px 120px}
.view{display:grid; gap:14px}

/* Week bar */
.weekbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.stepper{display:flex; align-items:center; background:var(--surface); border-radius:999px; padding:3px; box-shadow:var(--shadow)}
.stepper button{appearance:none; border:0; background:transparent; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:20px; line-height:1}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.3; cursor:default}
.stepper output{min-width:84px; text-align:center; font:700 15px/1 var(--display)}
.weekmeta{display:grid; min-width:0}
.weekmeta b{font-size:13px; font-weight:600}
.weekmeta span{font-size:13px; color:var(--fg-2)}
.now{font-size:12px; font-weight:650; color:var(--accent); background:var(--accent-soft); border:0; border-radius:999px; padding:4px 10px; cursor:pointer}

/* Day tabs */
.days{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px}
.day{appearance:none; border:2px solid transparent; background:var(--surface); border-radius:14px; padding:10px 12px; text-align:left; cursor:pointer; box-shadow:var(--shadow); display:grid; gap:2px; min-width:0}
.day .d{font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3); display:flex; align-items:center; gap:6px}
.day .d .today{width:6px; height:6px; border-radius:50%; background:var(--accent)}
.day b{font:700 15px/1.2 var(--display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.day .p{height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; margin-top:6px}
.day .p i{display:block; height:100%; background:var(--up); border-radius:2px; transition:width .3s}
.day[aria-pressed="true"]{border-color:var(--accent)}
@media (max-width:620px){
  .days{display:flex; overflow-x:auto; scrollbar-width:none; margin-inline:-16px; padding:2px 16px 6px}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 118px}
}

/* Day head */
.dayhead{background:var(--surface); border-radius:20px; padding:18px 20px; box-shadow:var(--shadow); display:grid; gap:12px}
.dayhead .row{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap}
.dayhead h2{font-size:24px; letter-spacing:-.02em}
.dayhead h2 small{font:600 15px var(--font); color:var(--fg-2); letter-spacing:0}
.dayhead .focus{color:var(--fg-2); font-size:14px; margin-top:2px}
.kpis{display:flex; gap:22px; flex-wrap:wrap}
.kpi{display:grid; gap:2px}
.kpi span{font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3)}
.kpi b{font:700 20px/1.1 var(--display); font-variant-numeric:tabular-nums}
.kpi b small{font:600 12px var(--font); color:var(--fg-2)}
.pbar{height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--up); border-radius:3px; transition:width .3s}
.restday{background:var(--surface); border-radius:20px; padding:18px 20px; box-shadow:var(--shadow); color:var(--fg-2); font-size:14px}

/* Delta chip */
.dl{display:inline-flex; align-items:center; gap:3px; font:650 12px/1 var(--display); padding:4px 7px; border-radius:999px; font-variant-numeric:tabular-nums; white-space:nowrap; background:var(--surface-2); color:var(--fg-2)}
.dl.up{background:var(--up-soft); color:var(--up)}
.dl.down{background:var(--down-soft); color:var(--down)}
.tag{font:700 10px/1 var(--font); letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-radius:6px; background:var(--accent-soft); color:var(--accent); vertical-align:middle}
.tag.new{background:var(--warn-soft); color:var(--warn)}

/* Exercise card */
.ex{background:var(--surface); border-radius:18px; padding:16px 18px; box-shadow:var(--shadow); display:grid; gap:12px}
.ex.done{box-shadow:var(--shadow), inset 3px 0 0 var(--up)}
.ex-h{display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:12px; align-items:start}
.ex-n{width:26px; height:26px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font:700 12px/1 var(--display); color:var(--fg-2)}
.ex.done .ex-n{background:var(--up); color:var(--on-accent)}
.ex-h h3{font-size:16px; font-weight:650; letter-spacing:-.005em}
.rx{font-size:13px; color:var(--fg-2); margin-top:2px; font-variant-numeric:tabular-nums}
.rest-b{appearance:none; border:0; background:var(--surface-2); border-radius:999px; padding:6px 10px; font-size:12px; font-weight:650; cursor:pointer; display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.rest-b svg{width:13px; height:13px}
.warnnote{font-size:13px; color:var(--warn); background:var(--warn-soft); padding:8px 10px; border-radius:10px}
details.note{font-size:13px; color:var(--fg-2)}
details.note summary{cursor:pointer; list-style:none; font-weight:600; color:var(--fg-2); display:inline-flex; gap:6px; align-items:center}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"ⓘ"}
details.note p{margin-top:6px}
.ex-in{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px 16px; align-items:end}
.fld{display:grid; gap:4px}
.fld label, .lab{font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3)}
.in{width:100%; padding:10px 8px; border-radius:11px; border:1px solid var(--line-2); background:var(--surface); font:650 17px/1 var(--display); text-align:center; font-variant-numeric:tabular-nums}
.in::placeholder{color:var(--fg-3); font-weight:500}
.in.w{width:96px}
.sets{display:flex; gap:8px; flex-wrap:wrap}
.sets .fld{width:62px}
.ex-ctl{grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.chips{display:inline-flex; gap:4px; align-items:center}
.chips .lab{margin-right:6px}
.chip{appearance:none; border:1px solid var(--line-2); background:var(--surface); min-width:36px; height:34px; border-radius:10px; font:650 14px/1 var(--display); cursor:pointer; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.flag{appearance:none; border:1px solid var(--line-2); background:var(--surface); border-radius:10px; height:34px; padding:0 10px; font-size:13px; font-weight:600; cursor:pointer; color:var(--fg-2)}
.flag[aria-pressed="true"]{background:var(--down-soft); border-color:var(--down); color:var(--down)}
.ex-meta{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; border-top:1px solid var(--line); padding-top:11px; font-size:13px; color:var(--fg-2)}
.ex-meta b{color:var(--fg); font-weight:600}
.next{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-weight:650; font-size:13px; padding:5px 10px; border-radius:999px; background:var(--surface-2); color:var(--fg)}
.next.inc{background:var(--up-soft); color:var(--up)}
.next.hold{background:var(--accent-soft); color:var(--accent)}
.next.red{background:var(--warn-soft); color:var(--warn)}
.next.stop{background:var(--down-soft); color:var(--down)}
@media (max-width:520px){
  .ex{padding:14px}
  .ex-in{grid-template-columns:minmax(0,1fr)}
  .in.w{width:100%}
  .sets .fld{flex:1 1 56px; width:auto}
  .next{margin-left:0}
}
.dayfoot{display:flex; gap:12px; align-items:end; flex-wrap:wrap; background:var(--surface); border-radius:18px; padding:14px 18px; box-shadow:var(--shadow)}
.dayfoot .in{width:96px}
.dayfoot p{font-size:13px; color:var(--fg-2); flex:1; min-width:180px}

/* Rest pill */
.restpill{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom, 0px) + 16px); z-index:50; background:var(--fg); color:var(--bg); border-radius:999px; padding:8px 8px 8px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,.3); font-variant-numeric:tabular-nums}
.restpill b{font:700 18px/1 var(--display); min-width:52px}
.restpill span{font-size:12px; opacity:.7}
.restpill button{appearance:none; border:0; background:rgba(127,127,127,.28); color:inherit; border-radius:999px; height:30px; padding:0 10px; font-weight:650; font-size:13px; cursor:pointer}
.restpill.done{background:var(--up); color:var(--on-accent)}

/* Cards / sections */
.card{background:var(--surface); border-radius:20px; padding:18px 20px; box-shadow:var(--shadow); min-width:0}
.card h3{font-size:17px; font-weight:650}
.card .sub{font-size:13px; color:var(--fg-2); margin-top:2px}
.card-h{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.kgrid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
@media (max-width:620px){ .kgrid{grid-template-columns:repeat(2, minmax(0,1fr))} }
.kbox{background:var(--surface); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); display:grid; gap:4px; min-width:0}
.kbox span{font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3)}
.kbox b{font:700 24px/1.1 var(--display); letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kbox b small{font:600 12px var(--font); color:var(--fg-2); letter-spacing:0}
.chart svg{width:100%; height:auto; display:block}
.tblwrap{overflow-x:auto; margin-inline:-4px}
table.pt{width:100%; border-collapse:collapse; min-width:560px; font-variant-numeric:tabular-nums}
.pt th, .pt td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:right; font-size:13px; white-space:nowrap}
.pt th:first-child, .pt td:first-child{text-align:left; white-space:normal}
.pt thead th{font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3)}
.pt thead th.sel{color:var(--accent)}
.pt tr.grp td{background:var(--surface-2); font-weight:650; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--fg-2)}
.pt td .v{display:block; font-weight:650; color:var(--fg)}
.pt td .c{display:block; font-size:11px; font-weight:650; color:var(--fg-3)}
.pt td .c.up{color:var(--up)} .pt td .c.down{color:var(--down)}
.pt td.sel{background:var(--accent-soft)}
.empty{color:var(--fg-3)}
.checkin{display:flex; gap:12px; flex-wrap:wrap; align-items:end}
.checkin .in{width:110px}

/* Program reference */
.ref details{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:0 18px}
.ref details + details{margin-top:10px}
.ref summary{cursor:pointer; list-style:none; padding:16px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; font:650 16px var(--display)}
.ref summary::-webkit-details-marker{display:none}
.ref summary::after{content:"›"; font-size:22px; color:var(--fg-3); transform:rotate(90deg); transition:transform .2s}
.ref details[open] summary::after{transform:rotate(-90deg)}
.ref summary small{font:500 13px var(--font); color:var(--fg-2); margin-left:auto; margin-right:8px}
.ref .body{padding-bottom:18px; font-size:14px; display:grid; gap:12px}
.rt{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.rt td, .rt th{padding:9px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; vertical-align:top}
.rt th{font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3)}
.rt tr:last-child td{border-bottom:0}
.rt td.r{text-align:right; white-space:nowrap}
.vb{display:grid; grid-template-columns:120px minmax(0,1fr) 92px; gap:10px; align-items:center; font-size:14px; padding:4px 0}
.vb .t{height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden}
.vb .t i{display:block; height:100%; border-radius:5px; background:var(--accent)}
.vb b{text-align:right; font-weight:650; font-variant-numeric:tabular-nums; font-size:13px}
.muted{color:var(--fg-2)}
ul.clean{margin:0; padding-left:18px; display:grid; gap:4px}

/* Data sheet */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.4)}
.sheet{position:fixed; z-index:70; left:0; right:0; bottom:0; margin:0 auto; max-width:560px; max-height:88vh; overflow:auto; background:var(--surface); border-radius:24px 24px 0 0; padding-top:18px; padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 22px); padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); display:grid; gap:16px; animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40px)} to{transform:none}}
.sheet-h{display:flex; justify-content:space-between; align-items:center}
.sheet-h h3{font-size:20px}
.srow{display:grid; gap:6px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0; padding-bottom:0}
.srow p{font-size:13px; color:var(--fg-2)}
.btns{display:flex; gap:8px; flex-wrap:wrap}
.btn{appearance:none; border:0; border-radius:999px; padding:10px 16px; font-weight:650; font-size:14px; cursor:pointer; background:var(--accent); color:var(--on-accent)}
.btn.g{background:var(--surface-2); color:var(--fg)}
.btn.d{background:var(--down-soft); color:var(--down)}
.msg{font-size:13px; padding:8px 10px; border-radius:10px; background:var(--surface-2)}
.msg.err{background:var(--down-soft); color:var(--down)}
.msg.ok{background:var(--up-soft); color:var(--up)}
input[type=date].in{font-size:15px; text-align:left; width:auto}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i>Hypertrophy 2.3</div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button type="button" data-v="log" aria-pressed="true">Log</button>
      <button type="button" data-v="progress" aria-pressed="false">Progress</button>
      <button type="button" data-v="program" aria-pressed="false">Program</button>
    </div>
    <span class="spacer"></span>
    <span class="sync" id="sync" role="status"><i></i><span id="syncT">Saved on this device</span></span>
    <button class="icon-btn" type="button" id="dataBtn" aria-label="Data, backup and settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5M4.5 12v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V12"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="weekbar" id="weekbar">
    <div class="stepper">
      <button type="button" id="wPrev" aria-label="Previous week">‹</button>
      <output id="wOut" class="num">Week 1</output>
      <button type="button" id="wNext" aria-label="Next week">›</button>
    </div>
    <div class="weekmeta"><b id="wDates">–</b><span id="wPhase">–</span></div>
    <button class="now" type="button" id="wNow" hidden>This week</button>
  </div>

  <section class="view" id="vLog" style="margin-top:14px">
    <div class="days" id="days" role="group" aria-label="Workout"></div>
    <div id="dayHead"></div>
    <div class="view" id="cards"></div>
    <div id="dayFoot"></div>
  </section>

  <section class="view" id="vProgress" style="margin-top:14px" hidden></section>
  <section class="view ref" id="vProgram" style="margin-top:14px" hidden></section>
</main>

<div class="restpill" id="restPill" hidden role="timer" aria-live="off">
  <div><b id="restT">0:00</b><span id="restL">Rest</span></div>
  <button type="button" id="restAdd">+30s</button>
  <button type="button" id="restX" aria-label="Stop rest timer">✕</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH" hidden>
  <div class="sheet-h"><h3 id="sheetH">Your data</h3><button class="icon-btn" type="button" id="sheetX" aria-label="Close">✕</button></div>
  <div class="srow"><span class="lab">Where it's saved</span><p id="storeInfo">–</p></div>
  <div class="srow">
    <label class="lab" for="startDate">Program start (week 1, Monday)</label>
    <input class="in" type="date" id="startDate">
    <p>Week numbers and "This week" are counted from this date.</p>
  </div>
  <div class="srow">
    <span class="lab">Backup</span>
    <p>Export everything as a JSON file, or load a file you exported before.</p>
    <div class="btns"><button class="btn" type="button" id="expBtn">Export JSON</button><button class="btn g" type="button" id="impBtn">Import JSON</button><input type="file" id="impFile" accept="application/json,.json" hidden></div>
    <div id="impMsg" hidden></div>
  </div>
  <div class="srow">
    <span class="lab">Reset</span>
    <div class="btns"><button class="btn d" type="button" id="clrWeek">Clear this week</button></div>
    <div id="clrConfirm" hidden></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtKg = n => n == null ? '–' : (Math.round(n * 100) / 100).toLocaleString('en-US', {maximumFractionDigits:2});
const fmtInt = n => Math.round(n).toLocaleString('en-US');
const pct = (a, b) => (a == null || b == null || !b) ? null : (a - b) / b * 100;
const fmtPct = p => p == null ? '' : (p > 0 ? '+' : p < 0 ? '−' : '±') + (Math.abs(p) < 10 ? Math.abs(p).toFixed(1) : Math.round(Math.abs(p))) + '%';
const dl = (p, label) => p == null ? '' : `<span class="dl ${p > 0.05 ? 'up' : p < -0.05 ? 'down' : ''}">${p > 0.05 ? '↑' : p < -0.05 ? '↓' : '='} ${fmtPct(p)}${label ? ' ' + label : ''}</span>`;

/* ============ PROGRAM: Hypertrophy 2.3 ============ */
const R = {press:['2–3 min',120], legs:['2–3 min',120], rdl:['2–3 min',120], iso:['60–120 s',60], shrug:['90–120 s',90]};
const X = (id, n, w, sets, lo, hi, rir, rest, step, o) => Object.assign({id, n, w, sets, lo, hi, rir, rest:R[rest][0], restS:R[rest][1], step}, o || {});
const DAYS = [
  {id:'pullA', dow:1, short:'Mon', name:'Pull A', plus:'+ Hamstrings', focus:'Lat width · Rear delts · Biceps', obj:'Develop lat width and upper-back musculature while maintaining controlled execution.', ex:[
    X('pa1','Neutral-Grip Lat Pulldown',47,3,10,12,'2','press',2.5,{warn:'Previously reached 0 RIR at 49.5 kg with groin discomfort. Return to 47 kg only if completely symptom-free. Stop if discomfort recurs.'}),
    X('pa2','Incline Chest-Supported DB Row',17.5,3,8,10,'2','press',2.5,{note:'Maintain 17.5 kg until you can complete 3 × 10 at about 2 RIR.'}),
    X('pa3','Straight-Arm Cable Pulldown',21.5,2,10,12,'1–2','iso',2.5,{note:'Maintain 21.5 kg; your previous effort reached 0 RIR.'}),
    X('pa4','Reverse Pec Deck',26.25,2,12,15,'1–2','iso',2.5,{note:'Maintain 26.25 kg until 2 × 15 at about 2 RIR.'}),
    X('pa5','Cable Biceps Curl',25,2,10,12,'1–2','iso',2.5),
    X('pa6','Leg Curl',12.5,3,10,12,'1–2','iso',2.5)]},
  {id:'pushA', dow:2, short:'Tue', name:'Push A', plus:'+ Quads', focus:'Lateral delts · Upper chest · Triceps', obj:'Prioritize lateral delts and upper chest while progressing quad strength.', ex:[
    X('pu1','Cable Lateral Raise',4.5,3,12,15,'1–2','iso',0.5),
    X('pu2','Incline Machine Press',55,3,8,10,'2','press',2.5,{tag:'test', note:'Previously 52.5 kg × 3 × 10 at 2–3 RIR. Test 55 kg.'}),
    X('pu3','Horizontal Leg Press',30,3,10,12,'2','legs',2.5,{tag:'test', note:'Previously 26.25 kg × 4 × 12 at 2–3 RIR. Test 30 kg.'}),
    X('pu4','Machine Chest Press',52.25,2,8,12,'1–2','press',2.5,{note:'Maintain 52.25 kg until you reach the upper rep target without approaching failure.'}),
    X('pu5','DB Lateral Raise',5,2,12,15,'1–2','iso',1),
    X('pu6','Seated OH DB Triceps Extension',12.5,2,8,12,'1–2','iso',2.5),
    X('pu7','V-Bar Pushdown',22.5,2,12,15,'1–2','iso',2.5)]},
  {id:'pullB', dow:4, short:'Thu', name:'Pull B', plus:'+ Hamstrings', focus:'Back thickness · Rear delts · Traps · Biceps', obj:'Build a thicker back, larger traps and stronger hamstrings.', ex:[
    X('pb1','Seated Row Machine',60,3,10,12,'1–2','press',2.5,{note:'Maintain 60 kg. Previous performance: 3 × 10 at 1 RIR.'}),
    X('pb2','Wide-Grip Pulldown',42.5,2,10,12,'1–2','press',2.5,{note:'Maintain 42.5 kg. Previous performance: 2 × 12 at 0 RIR.'}),
    X('pb3','DB Romanian Deadlift',null,3,8,12,'2–3','rdl',2.5,{tag:'new', wLabel:'TBD', warn:'First session is for technique and load calibration. Begin light and avoid anything that reproduces groin discomfort.'}),
    X('pb4','Reverse Pec Deck',26.25,2,12,15,'1–2','iso',2.5),
    X('pb5','Barbell Shrugs',60,2,10,15,'1–2','shrug',2.5,{note:'60 kg total = 20 kg bar + 40 kg plates.'}),
    X('pb6','Incline DB Curl',12.5,2,8,12,'1–2','iso',2.5),
    X('pb7','Preacher Curl',17.5,2,10,12,'1–2','iso',2.5)]},
  {id:'pushB', dow:5, short:'Fri', name:'Push B', plus:'+ Quads', focus:'Lateral-delt specialization · Upper chest · Triceps', obj:'Maximize lateral-delt growth while emphasizing upper chest.', ex:[
    X('pB1','DB Lateral Raise',5,3,10,15,'1–2','iso',1,{note:'Maintain strict technique rather than forcing load increases.'}),
    X('pB2','Incline DB Press',20,3,8,10,'2','press',2.5,{note:'20 kg is a provisional target; confirm against actual performance.'}),
    X('pB3','Leg Extension',36.25,4,10,12,'1–2','iso',2.5,{tag:'test', note:'Previously 33.75 kg × 3 × 15 at 1 RIR. Test 36.25 kg.'}),
    X('pB4','Pec Deck',null,2,10,15,'1–2','iso',2.5,{tag:'new', wLabel:'TBD', note:'Establish a comfortable weight that allows controlled reps without excessive shoulder stress.'}),
    X('pB5','Cable Lateral Raise',4.5,3,10,15,'1–2','iso',0.5,{note:'Maintain strict technique rather than forcing load increases.'}),
    X('pB6','Seated OH DB Triceps Extension',12.5,2,8,12,'1–2','iso',2.5),
    X('pB7','V-Bar Pushdown',22.5,1,12,15,'1–2','iso',2.5)]},
  {id:'upper', dow:6, short:'Sat', name:'Upper Spec', plus:'+ Legs', focus:'Delts · Arms · Back · Glutes', obj:'Add meaningful glute and quad training while maintaining additional upper-body volume.', ex:[
    X('up1','DB Bulgarian Split Squat',null,3,8,12,'3 initially','legs',2,{tag:'new', wLabel:'BW', bw:true, perLeg:true, warn:'Prior inguinal hernia repair and recent groin symptoms: start with bodyweight, one hand for balance, comfortable stride, ~3 RIR, no prolonged breath-holding or maximal bracing. Add dumbbells only after comfortable, symptom-free sessions. Clinical assessment is recommended before demanding loads. Stop if pain, pulling or pressure occurs.'}),
    X('up2','Horizontal Leg Press',30,3,10,12,'2','legs',2.5),
    X('up3','Cable Lateral Raise',4.5,2,12,15,'1–2','iso',0.5),
    X('up4','Incline Chest-Supported DB Row',17.5,2,8,12,'1–2','press',2.5),
    X('up5','Cable Biceps Curl',25,2,10,12,'1–2','iso',2.5),
    X('up6','V-Bar Pushdown',22.5,2,12,15,'1–2','iso',2.5)]}
];
const DAY = Object.fromEntries(DAYS.map(d => [d.id, d]));
const daySets = d => d.ex.reduce((a, e) => a + e.sets, 0);
const TOTAL_SETS = DAYS.reduce((a, d) => a + daySets(d), 0);
const PHASE = w => w === 1 ? 'Calibrate RDL, pec deck and split-squat loads' : w <= 3 ? 'Establish repeatable performance at target RIR' : w <= 6 ? 'Progress loads or reps as earned' : w === 7 ? 'Assess fatigue; deload if needed' : w === 8 ? 'Review strength, bodyweight, waist and recovery' : 'Beyond the 8-week block: keep the program, keep progressing';
const MAX_WEEK = 52;

/* ============ STATE ============ */
const LS_KEY = 'h23:state', UI_KEY = 'h23:ui';
const lsGet = (k, d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
const isoDate = d => { const t = new Date(d); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 10); };
const mondayOf = d => { const t = new Date(d); t.setHours(12,0,0,0); const k = (t.getDay() + 6) % 7; t.setDate(t.getDate() - k); return isoDate(t); };

let S = lsGet(LS_KEY, null);
if (!S || typeof S !== 'object' || !S.weeks) S = {settings:{start: mondayOf(new Date())}, weeks:{}};
if (!S.settings || !S.settings.start) S.settings = {start: mondayOf(new Date())};

const weekNow = () => { const s = Date.parse(S.settings.start + 'T12:00:00'); const n = Math.floor((Date.now() - s) / 6048e5) + 1; return Math.min(MAX_WEEK, Math.max(1, n)); };
const ui = lsGet(UI_KEY, {});
let view = ['log','progress','program'].includes(ui.view) ? ui.view : 'log';
let week = weekNow();
let metric = ['load','vol','e1rm'].includes(ui.metric) ? ui.metric : 'vol';
function defaultDay(){
  const dow = new Date().getDay();
  const hit = DAYS.find(d => d.dow === dow); if (hit) return hit.id;
  const next = DAYS.find(d => d.dow > dow) || DAYS[0]; return next.id;
}
let dayId = defaultDay();
const saveUI = () => lsSet(UI_KEY, {view, metric});

const W = n => S.weeks[n] || (S.weeks[n] = {days:{}, body:{}});
const peekW = n => S.weeks[n];
const entryOf = (n, d, s) => { const w = peekW(n); return w && w.days[d] && w.days[d].ex && w.days[d].ex[s] || null; };
const entryW = (n, d, s) => { const w = W(n); w.days[d] = w.days[d] || {ex:{}}; w.days[d].ex = w.days[d].ex || {}; return w.days[d].ex[s] = w.days[d].ex[s] || {w:null, reps:[], rir:null, pain:false}; };

/* ============ METRICS + RULES ============ */
function m(e, slot){
  if (!e) return null;
  const reps = (e.reps || []).slice(0, slot.sets).map(r => num(r)).filter(r => r != null && r > 0);
  if (!reps.length) return null;
  const w = num(e.w) || 0;
  const vol = w > 0 ? reps.reduce((a, r) => a + w * r, 0) : reps.reduce((a, r) => a + r, 0);
  const e1 = w > 0 ? Math.max(...reps.map(r => w * (1 + r / 30))) : null;
  return {w, reps, vol, e1, done: reps.length, full: reps.length >= slot.sets, bwVol: !(w > 0)};
}
function prevOf(n, d, slot){
  for (let k = n - 1; k >= 1; k--){ const x = m(entryOf(k, d, slot.id), slot); if (x) return {k, x, e: entryOf(k, d, slot.id)}; }
  return null;
}
function decide(e, slot){
  const x = m(e, slot);
  if (!x) return null;
  if (e.pain) return {k:'stop', cls:'stop', t:'Stop and reassess'};
  if (!x.full) return {k:'partial', cls:'', t:`${x.done} of ${slot.sets} sets logged`};
  if (x.reps.some(r => r < slot.lo)) return {k:'red', cls:'red', t:'Maintain or reduce', nw:x.w};
  const rir = e.rir == null ? null : +e.rir;
  if (rir == null) return {k:'rir', cls:'', t:'Log the final-set RIR'};
  const step = slot.step;
  if (x.reps.every(r => r >= slot.hi) && rir >= 2) return {k:'inc', cls:'inc', t:x.w > 0 ? `Increase → ${fmtKg(x.w + step)} kg` : 'Increase: add light dumbbells', nw: x.w > 0 ? x.w + step : null};
  if (rir >= 3) return {k:'cons', cls:'inc', t:x.w > 0 ? `Consider ${fmtKg(x.w + step)} kg` : 'Consider light dumbbells', nw: x.w > 0 ? x.w + step : null};
  return {k:'hold', cls:'hold', t: rir === 0 ? 'Maintain · reached failure' : 'Maintain, add reps', nw:x.w};
}
function suggestW(n, d, slot){
  const p = prevOf(n, d, slot);
  if (!p) return slot.w;
  const dec = decide(p.e, slot);
  if (dec && dec.nw != null && slot.id !== 'up1') return dec.nw;
  if (dec && dec.nw != null) return dec.nw;
  return p.x.w > 0 ? p.x.w : slot.w;
}
function dayStats(n, d){
  const day = DAY[d]; let sets = 0, exDone = 0, vol = 0, pvol = 0, comparable = false;
  day.ex.forEach(slot => {
    const x = m(entryOf(n, d, slot.id), slot);
    if (x){ sets += x.done; if (x.full) exDone++; if (!x.bwVol) vol += x.vol; }
    const p = n > 1 ? m(entryOf(n - 1, d, slot.id), slot) : null;
    if (x && p && !x.bwVol && !p.bwVol){ pvol += p.vol; comparable = true; }
  });
  let cmpNow = 0;
  if (comparable) day.ex.forEach(slot => { const x = m(entryOf(n, d, slot.id), slot), p = m(entryOf(n - 1, d, slot.id), slot); if (x && p && !x.bwVol && !p.bwVol) cmpNow += x.vol; });
  return {sets, exDone, vol, dpct: comparable ? pct(cmpNow, pvol) : null};
}
function weekStats(n){
  let sets = 0, vol = 0, rirSum = 0, rirN = 0, ups = 0, downs = 0, logged = 0;
  DAYS.forEach(d => d.ex.forEach(slot => {
    const e = entryOf(n, d.id, slot.id), x = m(e, slot);
    if (!x) return;
    logged++; sets += x.done; if (!x.bwVol) vol += x.vol;
    if (e.rir != null){ rirSum += +e.rir; rirN++; }
    const p = n > 1 ? m(entryOf(n - 1, d.id, slot.id), slot) : null;
    if (p && x.w > 0 && p.w > 0){ if (x.w > p.w) ups++; else if (x.w < p.w) downs++; }
  }));
  return {sets, vol, rir: rirN ? rirSum / rirN : null, ups, downs, logged};
}
const lastLoggedWeek = () => Math.max(0, ...Object.keys(S.weeks).map(Number).filter(n => weekStats(n).sets > 0));

/* ============ PERSISTENCE ============ */
let mode = 'local', db = null, col = null, uid = null, cloudReady = false;
const dirty = new Set(); const writing = new Set(); let wTimer = null, lsTimer = null;
function setSync(cls, t){ const el = $('#sync'); el.className = 'sync ' + cls; $('#syncT').textContent = t; }
function persist(n){
  clearTimeout(lsTimer);
  lsTimer = setTimeout(() => { if (!lsSet(LS_KEY, S) && mode === 'local') setSync('warn', 'Browser storage is blocked: export to keep data'); else if (mode === 'local') setSync('ok', 'Saved on this device'); }, 250);
  if (n != null) dirty.add('w' + n);
  if (mode === 'cloud'){ setSync('busy', 'Saving…'); clearTimeout(wTimer); wTimer = setTimeout(flush, 800); }
}
function docBody(id){ if (id === 'settings') return {start: S.settings.start}; const w = S.weeks[+id.slice(1)] || {days:{}, body:{}}; return {days: w.days || {}, body: w.body || {}, updatedAt: new Date().toISOString()}; }
async function flush(){
  if (mode !== 'cloud' || !col) return;
  const ids = [...dirty].filter(id => !writing.has(id));
  for (const id of ids){
    dirty.delete(id); writing.add(id);
    try { await col.doc(id).set(docBody(id)); }
    catch(err){
      if (err && err.code === 'unavailable'){ dirty.add(id); setTimeout(flush, 1500 + Math.random() * 1500); }
      else if (err && err.code === 'quota_exceeded'){ setSync('warn', 'Cloud storage full: export a backup'); }
      else { mode = 'local'; setSync('warn', 'Sync stopped: saving on this device'); }
    }
    finally { writing.delete(id); }
  }
  if (mode === 'cloud') setSync(dirty.size ? 'busy' : 'ok', dirty.size ? 'Saving…' : 'Saved · synced');
  if (dirty.size) { clearTimeout(wTimer); wTimer = setTimeout(flush, 600); }
}
let pendingRemote = false;
const typing = () => { const a = document.activeElement; return a && /^(INPUT|SELECT)$/.test(a.tagName) && a.closest('main'); };
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRemote && !typing()){ pendingRemote = false; renderAll(); } }, 0));

async function initCloud(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ setSync('ok', lsGet(LS_KEY, null) ? 'Saved on this device' : 'Saving on this device'); return; }
  setSync('busy', 'Connecting…');
  try {
    const [user, dbx] = await Promise.all([c.use('user'), c.use('db')]);
    uid = user ? await user.id() : null;
    if (!dbx || !uid){ setSync('ok', 'Saved on this device'); return; }
    db = dbx; col = db.collection('data/users/' + uid);
    let first = true;
    const timer = setTimeout(() => { if (!cloudReady) setSync('warn', "Can't reach sync yet: saving on this device"); }, 10000);
    col.onSnapshot(snap => {
      if (first && snap.metadata.fromCache && snap.empty) return;
      if (!snap.metadata.fromCache){ clearTimeout(timer); }
      const docs = {}; snap.docs.forEach(d => { docs[d.id] = d.data(); });
      if (first){
        first = false; cloudReady = true; mode = 'cloud';
        const hasCloud = Object.keys(docs).some(k => /^w\d+$/.test(k));
        if (!hasCloud && Object.keys(S.weeks).length){
          Object.keys(S.weeks).forEach(n => dirty.add('w' + n)); dirty.add('settings'); flush();
        } else if (hasCloud){ applyDocs(docs, true); }
        else dirty.add('settings'), flush();
        setSync('ok', 'Saved · synced'); renderAll(); return;
      }
      if (applyDocs(docs, false)){ if (typing()) pendingRemote = true; else renderAll(); }
    }, err => { clearTimeout(timer); mode = 'local'; setSync('warn', 'Sync unavailable: saving on this device'); });
  } catch(e){ setSync('ok', 'Saved on this device'); }
}
function applyDocs(docs, initial){
  let changed = false;
  Object.entries(docs).forEach(([id, body]) => {
    if (dirty.has(id) || writing.has(id)) return;
    if (id === 'settings'){ if (body.start && body.start !== S.settings.start){ S.settings.start = body.start; changed = true; } return; }
    const mm = /^w(\d+)$/.exec(id); if (!mm) return;
    const n = +mm[1], cur = S.weeks[n], next = {days: JSON.parse(JSON.stringify(body.days || {})), body: JSON.parse(JSON.stringify(body.body || {}))};
    if (!cur || JSON.stringify({days:cur.days, body:cur.body}) !== JSON.stringify(next)){ S.weeks[n] = next; changed = true; }
  });
  if (changed) lsSet(LS_KEY, S);
  return changed;
}

/* ============ LOG VIEW ============ */
const clock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
function renderWeekbar(){
  $('#wOut').textContent = 'Week ' + week;
  $('#wPrev').disabled = week <= 1; $('#wNext').disabled = week >= MAX_WEEK;
  const s = new Date(S.settings.start + 'T12:00:00'); s.setDate(s.getDate() + (week - 1) * 7);
  const e = new Date(s); e.setDate(e.getDate() + 6);
  const f = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  const wn = weekNow();
  $('#wDates').textContent = `${f(s)} – ${f(e)}${week === wn ? ' · this week' : ''}`;
  $('#wPhase').textContent = PHASE(week);
  $('#wNow').hidden = week === wn;
  $('#weekbar').hidden = view === 'program';
}
function renderDays(){
  const today = new Date().getDay(), wn = weekNow();
  $('#days').innerHTML = DAYS.map(d => {
    const st = dayStats(week, d.id), tot = daySets(d);
    return `<button type="button" class="day" data-d="${d.id}" aria-pressed="${d.id === dayId}"><span class="d">${d.short}${d.dow === today && week === wn ? '<span class="today" aria-label="today"></span>' : ''}</span><b>${d.name}</b><span class="p" aria-hidden="true"><i style="width:${Math.min(100, st.sets / tot * 100)}%"></i></span></button>`;
  }).join('');
}
function renderDayHead(){
  const d = DAY[dayId], st = dayStats(week, dayId), tot = daySets(d);
  const dow = new Date().getDay(), rest = (dow === 3 || dow === 0) && week === weekNow();
  $('#dayHead').innerHTML = `${rest ? `<div class="restday" style="margin-bottom:14px">Today is a recovery day. Next up: <b style="color:var(--fg)">${DAY[defaultDay()].short} · ${DAY[defaultDay()].name}</b>.</div>` : ''}
    <div class="dayhead">
      <div class="row"><div><h2>${d.name} <small>${d.plus}</small></h2><p class="focus">${d.focus}</p></div>
        <div class="kpis">
          <div class="kpi"><span>Sets</span><b id="kSets">${st.sets}<small> / ${tot}</small></b></div>
          <div class="kpi"><span>Volume</span><b id="kVol">${st.vol ? fmtInt(st.vol) : '–'}<small> kg</small></b></div>
          <div class="kpi"><span>vs last week</span><b id="kD">${st.dpct == null ? '<small>no data</small>' : dl(st.dpct)}</b></div>
        </div></div>
      <div class="pbar" aria-hidden="true"><i id="kBar" style="width:${Math.min(100, st.sets / tot * 100)}%"></i></div>
    </div>`;
}
function setsInputs(slot, e, i){
  let h = '';
  for (let k = 0; k < slot.sets; k++){
    const v = e && e.reps && e.reps[k] != null ? e.reps[k] : '';
    h += `<div class="fld"><label for="r-${slot.id}-${k}">Set ${k + 1}</label><input class="in" id="r-${slot.id}-${k}" data-s="${slot.id}" data-k="${k}" inputmode="numeric" pattern="[0-9]*" value="${esc(v)}" placeholder="${slot.hi}" aria-label="${esc(slot.n)} set ${k + 1} reps"></div>`;
  }
  return h;
}
function metaHTML(slot){
  const e = entryOf(week, dayId, slot.id), x = m(e, slot), p = prevOf(week, dayId, slot);
  const parts = [];
  if (p){
    const pe = p.e;
    parts.push(`<span>W${p.k}: <b>${p.x.w > 0 ? fmtKg(p.x.w) + ' kg' : 'BW'}</b> × ${p.x.reps.join('/')}${pe.rir != null ? ` · RIR ${pe.rir}` : ''}</span>`);

  const msg = $('#impMsg');
  try{
    const dlc = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dlc){ await dlc.save({filename, data}); msg.className = 'msg ok'; msg.textContent = 'Backup saved.'; msg.hidden = false; return; }
  }catch(err){ if (err && err.code === 'declined') return; }
  try{
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){ msg.className = 'msg err'; msg.textContent = "This view can't save files. Open the page in a browser to export."; msg.hidden = false; }
});
$('#impBtn').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  const msg = $('#impMsg'); msg.hidden = false;
  try{
    const j = JSON.parse(await f.text());
    if (!j || j.app !== 'hypertrophy-2.3' || typeof j.weeks !== 'object') throw new Error('shape');
    const n = Object.keys(j.weeks).length;
    msg.className = 'msg'; msg.innerHTML = `Replace your current data with this file (${n} week${n === 1 ? '' : 's'})? <div class="btns" style="margin-top:8px"><button class="btn" type="button" id="impYes">Replace</button><button class="btn g" type="button" id="impNo">Cancel</button></div>`;
    $('#impYes').onclick = () => {
      const old = Object.keys(S.weeks);
      S = {settings: j.settings && j.settings.start ? {start: j.settings.start} : S.settings, weeks: j.weeks};
      new Set([...old, ...Object.keys(S.weeks)]).forEach(k => { if (!S.weeks[k]) S.weeks[k] = {days:{}, body:{}}; dirty.add('w' + k); });
      dirty.add('settings'); persist(null); if (mode === 'cloud') flush();
      week = weekNow(); renderAll(); msg.className = 'msg ok'; msg.textContent = `Imported ${n} week${n === 1 ? '' : 's'}.`;
    };
    $('#impNo').onclick = () => { msg.hidden = true; };
  }catch(err){ msg.className = 'msg err'; msg.textContent = "That file isn't a Hypertrophy 2.3 export. Choose a JSON file exported from this page."; }
});
$('#clrWeek').addEventListener('click', () => {
  const c = $('#clrConfirm'); c.hidden = false; c.className = 'msg';
  c.innerHTML = `Clear everything logged in week ${week}? <div class="btns" style="margin-top:8px"><button class="btn d" type="button" id="clrYes">Clear week ${week}</button><button class="btn g" type="button" id="clrNo">Cancel</button></div>`;
  $('#clrYes').onclick = () => { S.weeks[week] = {days:{}, body:{}}; persist(week); renderAll(); c.className = 'msg ok'; c.textContent = `Week ${week} cleared.`; };
  $('#clrNo').onclick = () => { c.hidden = true; };
});

/* ============ NAV ============ */
$('#viewSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; saveUI(); renderAll(); window.scrollTo({top:0}); });
$('#wPrev').addEventListener('click', () => { week = Math.max(1, week - 1); renderAll(); });
$('#wNext').addEventListener('click', () => { week = Math.min(MAX_WEEK, week + 1); renderAll(); });
$('#wNow').addEventListener('click', () => { week = weekNow(); renderAll(); });

function renderLog(){ renderDays(); renderDayHead(); renderCards(); }
function renderAll(){
  document.querySelectorAll('#viewSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
  $('#vLog').hidden = view !== 'log'; $('#vProgress').hidden = view !== 'progress'; $('#vProgram').hidden = view !== 'program';
  renderWeekbar();
  if (view === 'log') renderLog(); else if (view === 'progress') renderProgress(); else if (!$('#vProgram').innerHTML) renderProgram();
}
renderAll();
initCloud();
})();
</script>
</body>
</html>
